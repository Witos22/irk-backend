# Konfiguracja wylacznie dla testow: baza w pamieci (H2), bez Dockera/Postgresa.
spring.application.name=irk-Backend

spring.datasource.url=jdbc:h2:mem:irk_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
